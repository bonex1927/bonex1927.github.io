<title>WebView Bridge Tester - Universal</title>
<style>
body{font-family:monospace;padding:16px;background:#0f1115;color:#e6e6e6}
h2{color:#4caf50} .card{background:#1e222a;border:1px solid #333;padding:12px;border-radius:12px;margin:10px 0}
.ok{color:#4caf50;font-weight:bold} .bad{color:#ff5252;font-weight:bold} .warn{color:#ffca28}

<body>
<h2>WebView Bridge Tester (Xiaomi / Other Browser)</h2>
<div class="card">
Tes ini untuk cek apakah WebView / Browser mengekspos JS Bridge yang bahaya.<br>
<b>Aman:</b> cuma cek keberadaan object, tidak eksekusi perintah berbahaya.
</div>

<div id="results"></div>

<button onclick="runAll()">JALANKAN TEST SEKARANG</button>
<button onclick="testFileAccess()">TES FILE ACCESS (file:///sdcard/)</button>

<script>
function addCard(title, status, detail){
  const d = document.createElement('div');
  d.className='card';
  d.innerHTML = `<b>${title}</b><br>Status: ${status}<br><pre>${detail}</pre>`;
  document.getElementById('results').appendChild(d);
}

function runAll(){
  document.getElementById('results').innerHTML='';
  const objs = ['Android','android','JavascriptInterface','JSInterface','NativeBridge','App','MiBridge','_app','xiaomi','miui'];
  objs.forEach(name=>{
    if(window[name]){
      try{
        const methods = Object.getOwnPropertyNames(window[name]).join(', ').substring(0,500);
        addCard(`Bridge object: window.${name}`, '<span class="bad">VULN - Object Ada!</span>', `Methods: ${methods}`);
      }catch(e){
        addCard(`Bridge object: window.${name}`, '<span class="bad">VULN - Object Ada tapi error list</span>', e.toString());
      }
    }else{
      addCard(`Bridge object: window.${name}`, '<span class="ok">AMAN - Tidak ada</span>', 'Object tidak terekspos');
    }
  });

  // Cek common WebView settings
  const ua = navigator.userAgent;
  addCard('User-Agent', '<span class="warn">INFO</span>', ua);

  // Cek apakah bisa akses file
  addCard('File Access Check', '<span class="warn">Manual test diperlukan</span>', 'Klik tombol TES FILE ACCESS di bawah. Kalau di Mi Browser / GetApps bisa baca file, itu High.');

  // Cek intent scheme yang bisa dipanggil
  addCard('Intent Test', '<span class="warn">INFO</span>', 'Coba buka link ini dari app lain: intent://bonex1927.github.io/izi#Intent;package=com.xiaomi.mipicks;end - Jika kebuka di GetApps dan Bridge terdeteksi VULN = Critical');
}

function testFileAccess(){
  // Ini cuma test baca file yang umum, tidak curi data pribadi
  const testPaths = ['file:///sdcard/Download/','file:///etc/hosts'];
  testPaths.forEach(p=>{
    fetch(p).then(r=>r.text().then(t=>{
      addCard(`File Access: ${p}`, '<span class="bad">VULN - Bisa baca file!</span>', t.substring(0,500));
    })).catch(e=>{
      addCard(`File Access: ${p}`, '<span class="ok">AMAN - Diblok</span>', e.toString().substring(0,300));
    });
  });
}
window.addEventListener('load', runAll);
</script>

ment(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
