<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Google</title>
<style>
  body{font-family:Arial,sans-serif;text-align:center;padding-top:70px;margin:0;}
  .logo{font-size:52px;letter-spacing:-3px;}
  .logo b:nth-child(1){color:#4285F4}.logo b:nth-child(2){color:#EA4335}
  .logo b:nth-child(3){color:#FBBC05}.logo b:nth-child(4){color:#4285F4}
  .logo b:nth-child(5){color:#34A853}.logo b:nth-child(6){color:#EA4335}
  .box{margin:30px auto;max-width:420px;padding:20px;}
  input{width:85%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:24px;}
  .t{color:#888;font-size:12px;margin-top:24px;}
</style>
</head>
<body>
<div class="logo"><b>G</b><b>o</b><b>o</b><b>g</b><b>l</b><b>e</b></div>
<div class="box">
  <p>Untuk hasil pencarian yang lebih relevan,<br>izinkan akses lokasi Anda.</p>
  <input type="text" placeholder="Telusuri Google...">
  <p class="t">HANYA untuk pengujian keamanan.</p>
</div>
<script>
  window.addEventListener('load', function(){
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(function(){}, function(){}, {timeout:10000});
    }
  });
</script>
</body>
</html>
