<!DOCTYPE html>
<html>
<button id="btn">Open Document PiP</button>
<script>
btn.onclick = async () => {
  // Step 1: Buka Doc PiP Window
  const pipWin = await documentPictureInPicture.requestWindow({width: 400, height: 300});
  
  // Step 2: Isi konten - untuk test lu
  pipWin.document.body.innerHTML = `
    <h1>Test Content from attacker.com</h1>
    <p>URL: ${location.href}</p>
    <p>Origin should be visible in PiP header?</p>
  `;
  
  // Step 3: Test case lu - buka google.com di tab utama setelah PiP kebuka
  // Cek manual: Apakah PiP header masih nampilin origin attacker.com atau hilang?
  // setTimeout(()=> window.open('https://google.com','_blank'), 2000);
}
</script>
</html>
